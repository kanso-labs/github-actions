name: Check shared docs
description:
  Compares the shared blocks marked in a repository's AGENTS.md against the
  canonical copies held here, so a paragraph every kanso-labs repository carries
  cannot go stale in one of them unnoticed.

inputs:
  file:
    default: AGENTS.md
    description:
      Markdown file to check. Every `<!-- shared:<name> -->` region in it is
      compared against `blocks/<name>.md` beside this action, and a region whose
      name has no such file is an error rather than a silent pass.
    required: false

runs:
  using: composite
  steps:
    # Checking out is the caller's job, the same way it is for setup-node and
    # lint-workflows. The file being checked has to be in the working directory
    # already.
    #
    # A repository opts in per block by wrapping its copy in the markers, so
    # there is no list of blocks to keep in step here: renovate carries the
    # four conventions bullets and none of the npm ones, and says so by marking
    # only conventions-core.
    - name: Check shared documentation blocks
      shell: bash
      env:
        INPUT_FILE: ${{ inputs.file }}
      run: $GITHUB_ACTION_PATH/check.sh
