name: Lint

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # Also the smoke test for actions/lint-workflows, the same way check-formatting
  # below is the one for actions/setup-node. It is the only place in this
  # repository that runs it, so a change breaking the action fails here rather
  # than in whichever repository next pins a new version. Do not "tidy" it into
  # a plain raven-actions/actionlint step.
  lint-workflows:
    name: Lint workflows
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Run actionlint
        uses: ./actions/lint-workflows

  # This job is also the smoke test for actions/setup-node and for
  # actions/check-shared-docs. It is the only place in this repository that runs
  # either, and a change breaking one fails here rather than in whichever
  # repository next pins a new version.
  #
  # check-shared-docs is a step of this job rather than a job of its own on
  # purpose. The ruleset requires this job by name; a new job would be a new
  # check name that nothing requires, free to fail without stopping anything —
  # which would make a drift guard that does not guard.
  check-formatting:
    name: Check formatting
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node
        uses: ./actions/setup-node

      - name: Check formatting
        run: npm run lint

      - name: Check shared documentation blocks
        uses: ./actions/check-shared-docs
