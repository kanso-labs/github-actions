name: Release Please

on:
  workflow_call:
    inputs:
      auto-merge:
        default: true
        description:
          Whether to enable auto-merge on the release pull requests this run
          opens or updates.
        required: false
        type: boolean
      dry-run:
        default: false
        description:
          Run release-please without opening a pull request or cutting a
          release. Exists so that this workflow can be exercised on a pull
          request, where a real run would otherwise write to the repository. Not
          something a release caller should set.
        required: false
        type: boolean
    outputs:
      paths_released:
        description: JSON array of the paths that had a release created.
        value: ${{ jobs.propose.outputs.paths_released }}
      prs:
        description: JSON array of the release pull requests opened or updated.
        value: ${{ jobs.propose.outputs.prs }}
      release_created:
        description:
          Whether a release was created for the root component. Empty in
          repositories that have no component at the repository root.
        value: ${{ jobs.propose.outputs.release_created }}
      releases_created:
        description: Whether any release was created.
        value: ${{ jobs.propose.outputs.releases_created }}
      tag_name:
        description: Tag the root component's release was cut at.
        value: ${{ jobs.propose.outputs.tag_name }}
      version:
        description: Full semver version of the root component's release.
        value: ${{ jobs.propose.outputs.version }}
    secrets:
      app-id:
        description:
          Deprecated alias for client-id, taking an app id rather than a client
          id. All three consumers still pass this, so it stays. Pass one or the
          other, not both.
        required: false
      client-id:
        description:
          Client ID of a GitHub App installed on the calling repository. Supply
          this together with private-key. Without both, the run falls back to
          GITHUB_TOKEN and the release pull requests it opens will not start any
          workflow runs.
        required: false
      private-key:
        description: Private key of the GitHub App named above.
        required: false

# Deliberately no concurrency block, and the caller has to carry one instead.
# Overlapping release-please runs race each other, so the guard is not optional
# — but GitHub documents concurrency at the caller, and says nothing either way
# about a group declared in a called workflow. A guard that only matters during
# a rare race is the worst possible place to rely on undocumented behaviour: if
# it silently did nothing here, every consumer would lose it at once and none
# of them would find out until the race actually happened. At the caller it is
# supported, it is visible in review, and forgetting it costs one repository
# rather than all of them. README.md carries the block to copy.

# Deliberately no permissions block. The caller grants what its token needs,
# and that differs: a repository using the application token below can leave
# GITHUB_TOKEN on contents: read, while one falling back to it needs contents,
# issues and pull-requests at write. Declaring write here would fail the run
# for the first kind rather than let it keep the tighter grant.

jobs:
  propose:
    name: Propose releases
    runs-on: ubuntu-latest
    outputs:
      paths_released: ${{ steps.release.outputs.paths_released }}
      prs: ${{ steps.release.outputs.prs }}
      release_created: ${{ steps.release.outputs.release_created }}
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    env:
      # The secrets context is not available to a step's if condition, so the
      # presence check has to read the value through env instead. Either input
      # counts as "a credential was supplied", which is all the checks below
      # ask about.
      CLIENT_ID: ${{ secrets.client-id || secrets.app-id }}
    steps:
      # Pull requests opened with the default GITHUB_TOKEN do not start
      # workflow runs. Their checks sit at action_required until somebody
      # approves them by hand, so a release stalls until then. Requests made
      # with an application token trigger the checks like any other.
      - name: Mint an application token
        id: app-token
        if: env.CLIENT_ID != ''
        uses: actions/create-github-app-token@v3.2.0
        with:
          # Both inputs land here, and a caller still passing an app id keeps
          # working: the action hands whichever value it gets to GitHub as the
          # JWT issuer, and GitHub accepts an app id there as readily as a
          # client id. Only the action's own `app-id` input is deprecated, and
          # not using it is what stops the warning on every run.
          client-id: ${{ secrets.client-id || secrets.app-id }}
          private-key: ${{ secrets.private-key }}

      - name: Warn that no application token was supplied
        if: env.CLIENT_ID == ''
        run: |
          echo '::warning::No client-id secret was supplied, so this run used GITHUB_TOKEN. Its release pull request will not start any workflow runs, so required checks never report on it, and auto-merge is disabled below because merging it as the token would leave the release half-cut. Merge it yourself — a push by a human does trigger the run that tags it. Installing a GitHub App and passing client-id and private-key removes all of this.'

      # A skipped step's outputs are empty strings, so this falls through to
      # the default token whenever the application token was not minted.
      - name: Propose releases
        id: release
        uses: googleapis/release-please-action@v5.0.0
        with:
          # Both skips together are what make dry-run write nothing: one
          # suppresses the pull request, the other the tag and release. With
          # them set, the step still resolves the config, walks the commits and
          # computes the versions — which is the part worth exercising, and the
          # part a bad bump to this action would break.
          skip-github-pull-request: ${{ inputs.dry-run }}
          skip-github-release: ${{ inputs.dry-run }}
          token: ${{ steps.app-token.outputs.token || github.token }}

      # Requires the application token, not just the auto-merge input. Merging
      # the release pull request is only half of a release: that merge pushes
      # the default branch, and the run it starts is what actually cuts the tag
      # and the GitHub release. A push made with GITHUB_TOKEN starts no run at
      # all, so auto-merging as it strands the release with its version bumped
      # on the branch and nothing tagged — worse than not auto-merging, because
      # the pull request is now closed and there is nothing left to merge by
      # hand. A human's merge does start that run, so the fallback path leaves
      # this to them.
      #
      # Auto-merge also only queues when something is already blocking the pull
      # request, which is normally a ruleset requiring status checks. Remove
      # that rule and this stops waiting for anything: --auto on an unblocked
      # pull request merges it on the spot.
      #
      # Failing to enable it is not worth failing the run over. The release
      # pull request itself is already open and correct, and merging it by hand
      # still works, so this warns and moves on.
      #
      # The dry-run test cannot reach this anyway, since skipping the pull
      # request leaves prs empty, but it is named in the condition regardless.
      # A step that merges things should say when it does not run rather than
      # rely on another output happening to be empty.
      - name: Enable auto-merge on the release pull requests
        if:
          inputs.auto-merge && !inputs.dry-run && env.CLIENT_ID != '' &&
          steps.release.outputs.prs != '' && steps.release.outputs.prs != '[]'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          GH_REPO: ${{ github.repository }}
          PRS: ${{ steps.release.outputs.prs }}
        run: |
          jq -r '.[].number' <<< "${PRS}" | while read -r pr; do
            if gh pr merge --auto --squash "${pr}"; then
              echo "Auto-merge enabled on #${pr}."
            else
              echo "::warning::Could not enable auto-merge on #${pr}. Merge it by hand."
            fi
          done
