name: Test

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  # _release-please.yaml is the one thing here that nothing exercised. The
  # composite action has a live smoke test in lint.yaml, but this workflow only
  # ever runs on a push to a default branch, so the two actions it pins —
  # release-please-action and create-github-app-token — reached main having
  # never been started, and then ran for real in four repositories at once.
  #
  # This calls it in dry-run, where release-please still resolves the config,
  # walks the commits and computes versions, but opens no pull request and cuts
  # no release. No secrets are passed, so it also covers the GITHUB_TOKEN
  # fallback path and the warning that goes with it.
  #
  # Referenced by path, which is what runs the version in the pull request —
  # the only version that matters here, because the point is to fail before the
  # merge rather than after it. release-please.yaml reaches the same workflow
  # the same way; it used to pin a tag, and the comment there says why it does
  # not any more.
  release-please:
    name: Dry run release-please
    permissions:
      contents: read
    uses: ./.github/workflows/_release-please.yaml
    with:
      dry-run: true
