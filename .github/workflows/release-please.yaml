name: Release Please

on:
  push:
    branches:
      - main
  # release-please only ever reacts to a push, which leaves no way to ask it to
  # look again. That matters when a release pull request has to be discarded:
  # release-please rewrites one only when the release it computes changes, so a
  # pull request that cannot merge is not repaired by closing it, and nothing
  # proposes a replacement until somebody happens to push. This is that lever,
  # and it is also how to recover from a bad merge to _release-please.yaml,
  # which this workflow now runs straight from the branch.
  workflow_dispatch:

# Every release merge pushes main, and every push starts a run. Several merges
# landing inside a minute start overlapping runs that try to cut the same tags
# and strip the same labels, and one dies on the other's half-finished work.
# Do not add cancel-in-progress: the last push must still get a run, or the
# release it carries is never proposed.
#
# This belongs to the caller rather than to _release-please.yaml. See the
# comment there for why.
concurrency:
  cancel-in-progress: false
  group: release-please

# The application token below does the writing, so GITHUB_TOKEN stays on read.
permissions:
  contents: read

jobs:
  # Passes the same organization secrets the other three consumers pass. This
  # repository was the last one still falling back to GITHUB_TOKEN, from back
  # when no application existed to mint a token from — which stopped being
  # harmless once its ruleset began requiring status checks, because a release
  # pull request opened with that token starts no runs and so can never report
  # the checks it now has to pass.
  release-please:
    name: Propose releases
    # Referenced by path, and a tag here would be a loop. Pinning one makes this
    # repository a consumer of itself: Renovate bumps the pin, the bump lands as
    # `deps` and so cuts a patch release, the release moves the tag, and the next
    # Renovate run bumps it again — one release every three hours, each carrying
    # nothing but the bump of the one before it. v3.0.1 was the first turn.
    #
    # What the tag bought was exercising the call shape consumers use, and that
    # is thinner than it sounds: _release-please.yaml references no sibling
    # action or workflow, only external pinned ones, so nothing in it resolves
    # differently between the two forms. Four consumers exercise the tag form
    # continuously in any case.
    #
    # The cost is that main now always runs main, so a bad merge to
    # _release-please.yaml breaks this repository's own releases rather than
    # waiting for a bump to carry it in. Push the fix and the next run has it;
    # workflow_dispatch above is the lever if nothing else is due to push.
    uses: ./.github/workflows/_release-please.yaml
    secrets:
      client-id: ${{ secrets.RELEASE_PLEASE_CLIENT_ID }}
      private-key: ${{ secrets.RELEASE_PLEASE_PRIVATE_KEY }}
