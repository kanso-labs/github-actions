name: Release Please

on:
  push:
    branches:
      - main
  # Releases are batched to one a day rather than one per merge. The push above
  # keeps the release pull request current — its changelog and its version
  # always reflect main — and this is the only trigger that turns merging on,
  # through the auto-merge input below.
  #
  # 09:00 UTC is 06:00 America/Sao_Paulo, the timezone Renovate runs on, so the
  # day starts with yesterday's release already cut. GitHub queues scheduled
  # runs hardest on the hour and may start this one a few minutes late, which
  # for a daily release costs nothing.
  #
  # GitHub disables a scheduled workflow after 60 days without repository
  # activity. Renovate's commits keep this one alive, but that is the shape a
  # silent stop to releasing would take.
  schedule:
    - cron: '0 9 * * *'
  # Neither trigger above can be asked to look again now: one waits for a push,
  # the other for the clock. That matters when a release pull request has to be
  # discarded, because release-please rewrites one only when the release it
  # computes changes — so a pull request that cannot merge is not repaired by
  # closing it, and nothing proposes a replacement until somebody happens to
  # push. This is that lever, and it is also how to recover from a bad merge to
  # _release-please.yaml, which this workflow now runs straight from the branch.
  workflow_dispatch:

# Every release merge pushes main, and every push starts a run. Several merges
# landing inside a minute start overlapping runs that try to cut the same tags
# and strip the same labels, and one dies on the other's half-finished work.
# Do not add cancel-in-progress: the last push must still get a run, or the
# release it carries is never proposed.
#
# This belongs to the caller rather than to _release-please.yaml. See the
# comment there for why.
concurrency:
  cancel-in-progress: false
  group: release-please

# The application token below does the writing, so GITHUB_TOKEN stays on read.
permissions:
  contents: read

jobs:
  # Passes the same organization secrets the other three consumers pass. This
  # repository was the last one still falling back to GITHUB_TOKEN, from back
  # when no application existed to mint a token from — which stopped being
  # harmless once its ruleset began requiring status checks, because a release
  # pull request opened with that token starts no runs and so can never report
  # the checks it now has to pass.
  release-please:
    name: Propose releases
    # Referenced by path, and a tag here would be a loop. Pinning one makes this
    # repository a consumer of itself: Renovate bumps the pin, the bump lands as
    # `deps` and so cuts a patch release, the release moves the tag, and the next
    # Renovate run bumps it again — one release every three hours, each carrying
    # nothing but the bump of the one before it. v3.0.1 was the first turn.
    #
    # What the tag bought was exercising the call shape consumers use, and that
    # is thinner than it sounds: _release-please.yaml references no sibling
    # action or workflow, only external pinned ones, so nothing in it resolves
    # differently between the two forms. Four consumers exercise the tag form
    # continuously in any case.
    #
    # The cost is that main now always runs main, so a bad merge to
    # _release-please.yaml breaks this repository's own releases rather than
    # waiting for a bump to carry it in. Push the fix and the next run has it;
    # workflow_dispatch above is the lever if nothing else is due to push.
    uses: ./.github/workflows/_release-please.yaml
    with:
      # True only on the scheduled run, which is what batches a day of merges
      # into one release. A push proposes without merging, and so does
      # workflow_dispatch — the lever above re-proposes a stuck release pull
      # request rather than releasing on demand. To release sooner than the next
      # scheduled run, enable auto-merge on the pull request by hand.
      #
      # Evaluated here rather than inside _release-please.yaml on purpose. The
      # caller is where the event is unambiguous, and it leaves auto-merge a
      # mechanical input that does what its name says, rather than a release
      # policy the shared workflow imposes on every consumer at once.
      auto-merge: ${{ github.event_name == 'schedule' }}
    secrets:
      client-id: ${{ secrets.RELEASE_PLEASE_CLIENT_ID }}
      private-key: ${{ secrets.RELEASE_PLEASE_PRIVATE_KEY }}
